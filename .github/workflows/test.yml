name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=pytbv --cov-report=xml --cov-report=term-missing
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v || true
          # Run standalone integration tests
          python tests/integration/test_cocotb_only.py
          python tests/integration/test_basic_pyuvm.py
